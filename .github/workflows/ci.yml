name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint application and tests
        run: python -m ruff check src tests scripts launcher.py

      # Native speech integration requires downloaded model/runtime artifacts
      # and a speech fixture. Controller/audio/Win32 unit tests use fakes and
      # offscreen Qt, so CI never opens a microphone or types into a real app.
      - name: Run automated unit and regression tests
        run: python -m pytest --strict-markers -q -p no:cacheprovider -p no:faulthandler -m "not integration"
